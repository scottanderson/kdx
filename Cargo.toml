[workspace]
resolver = "2"
members = [
    "crates/kdx-proto",
    "crates/kdx-codec",
    "crates/kdx-client",
    "crates/kdx-cli",
    "crates/kdx-server",
    "crates/kdx-daemon",
    "crates/kdx-tracker",
    "crates/kdx-dissect",
    "crates/kdx-test-tables",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_const_for_fn = "warn"

[workspace.dependencies]
kdx-proto = { path = "crates/kdx-proto", version = "0.1.0" }
kdx-codec = { path = "crates/kdx-codec", version = "0.1.0" }
kdx-client = { path = "crates/kdx-client", version = "0.1.0" }
kdx-server = { path = "crates/kdx-server", version = "0.1.0" }
kdx-test-tables = { path = "crates/kdx-test-tables" }

# The cipher is slow unoptimized, and the capture tests decrypt megabytes.
[profile.dev.package.twofish]
opt-level = 3
