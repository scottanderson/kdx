[workspace]
resolver = "2"
members = ["crates/kdx-proto", "crates/kdx-dissect", "crates/kdx-client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_const_for_fn = "warn"

[workspace.dependencies]
kdx-proto = { path = "crates/kdx-proto", version = "0.1.0" }
