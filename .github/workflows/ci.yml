name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I ci/check-docs.py
      - run: pip install codespell
      - run: codespell

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The tables come only from these secrets, and the tests fail without them.
      - run: cargo test --workspace
        env:
          KDX_CHALLENGE_TABLE: ${{ secrets.KDX_CHALLENGE_TABLE }}
          HGC_CHALLENGE_TABLE: ${{ secrets.HGC_CHALLENGE_TABLE }}

  # Only new commits, since main keeps older ones that fail.
  gitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pipx install 'gitlint-core[trusted-deps]==0.19.1'
      - env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            range="origin/main..$SHA"
          fi
          if [ -z "$(git rev-list "$range")" ]; then
            echo "no new commits in $range"
            exit 0
          fi
          gitlint --commits "$range"

  # The one job branch protection requires; edit its needs to change what CI requires.
  ci-status:
    if: always()
    needs: [docs, check, gitlint]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
