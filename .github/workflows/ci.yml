name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The table comes only from this secret, and the tests fail without it.
      - run: cargo test --workspace
        env:
          KDX_CHALLENGE_TABLE: ${{ secrets.KDX_CHALLENGE_TABLE }}
          KDX_REQUIRE_TABLE: 1
      - run: >-
          cargo run -p kdx-dissect --
          captures/first-connect.pcapng --password 'lab-only-pw!1'
